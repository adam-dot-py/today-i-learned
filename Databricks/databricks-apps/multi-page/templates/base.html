<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Databricks App{% endblock %}</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    nav { background: #1b3a6b; padding: 0.75rem 1.5rem; display: flex; gap: 1.5rem; }
    nav a { color: #fff; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .alert { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
    .success { background: #d4edda; color: #155724; }
    .error   { background: #f8d7da; color: #721c24; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input, select { width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; padding: 0.5rem 1.5rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home.index') }}">Home</a>
    <a href="{{ url_for('data_entry.index') }}">Add Record</a>
    <a href="{{ url_for('view_data.index') }}">View Records</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
